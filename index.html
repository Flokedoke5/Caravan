<body><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useReducer, useRef } = React;


// --- CONSTANTS & GAME DATA ---
const SUITS = ['♠', '♥', '♦', '♣'];
// Faded, gritty colors for the wasteland
const SUIT_COLORS = { 
    '♠': 'text-[#1a1714]', 
    '♣': 'text-[#1a1714]', 
    '♥': 'text-[#7d221b]', 
    '♦': 'text-[#7d221b]', 
    '★': 'text-[#b8860b]' // Joker star in dirty gold
};
const CARD_VALUES = [
    { value: 1, label: 'A' }, { value: 2, label: '2' }, { value: 3, label: '3' },
    { value: 4, label: '4' }, { value: 5, label: '5' }, { value: 6, label: '6' },
    { value: 7, label: '7' }, { value: 8, label: '8' }, { value: 9, label: '9' },
    { value: 10, label: '10' }, { value: 11, label: 'J', isFace: true },
    { value: 12, label: 'Q', isFace: true }, { value: 13, label: 'K', isFace: true }
];

// --- HELPER FUNCTIONS ---
const generateId = () => Math.random().toString(36).substr(2, 9);

const createDeck = (owner, keys) => {
    let deck = [];
    SUITS.forEach(suit => {
        CARD_VALUES.forEach(card => {
            deck.push({ ...card, suit, key: suit + card.label, id: `${owner}-${generateId()}`, owner });
        });
    });
    // Add 2 Jokers to each deck
    deck.push({ value: 0, label: 'Jkr', isFace: true, suit: '★', id: `${owner}-${generateId()}-j1`, key: 'Jkr1', owner });
    deck.push({ value: 0, label: 'Jkr', isFace: true, suit: '★', id: `${owner}-${generateId()}-j2`, key: 'Jkr2', owner });
    
    if (keys) deck = deck.filter(c => keys.includes(c.key));
    // Shuffle
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
};

const getStackValue = (stack) => {
    let val = stack.baseCard.value;
    const kings = stack.modifiers.filter(m => m.value === 13).length;
    if (kings > 0) val = val * Math.pow(2, kings);
    return val;
};

const getCaravanTotal = (caravan) => caravan.reduce((sum, stack) => sum + getStackValue(stack), 0);

const getCaravanState = (caravan) => {
    if (caravan.length === 0) return { direction: null, suit: null, topValue: null };

    let direction = null;
    for (let i = 1; i < caravan.length; i++) {
        let prevVal = caravan[i - 1].baseCard.value;
        let currVal = caravan[i].baseCard.value;
        if (currVal > prevVal) direction = 'ASC';
        else if (currVal < prevVal) direction = 'DESC';
    }

    const lastStack = caravan[caravan.length - 1];
    const queens = lastStack.modifiers.filter(m => m.value === 12);
    let effectiveSuit = lastStack.baseCard.suit;

    if (queens.length > 0) {
        effectiveSuit = queens[queens.length - 1].suit;
        if (direction) {
            for (let i = 0; i < queens.length; i++) {
                direction = direction === 'ASC' ? 'DESC' : 'ASC';
            }
        }
    }

    return { direction, suit: effectiveSuit, topValue: lastStack.baseCard.value };
};

const isValidNumberPlay = (card, caravan) => {
    if (caravan.length === 0) return true;
    const state = getCaravanState(caravan);
    
    if (card.suit === state.suit) return true;
    if (card.value === state.topValue) return false;
    
    if (caravan.length === 1) return true;

    if (state.direction === 'ASC' && card.value > state.topValue) return true;
    if (state.direction === 'DESC' && card.value < state.topValue) return true;

    return false;
};

const checkTracksStatus = (tracks) => {
    let resolvedCount = 0;
    let userWins = 0;
    let aiWins = 0;

    const trackResults = tracks.map(t => {
        const uTotal = getCaravanTotal(t.user);
        const aTotal = getCaravanTotal(t.ai);
        
        const uValid = uTotal >= 21 && uTotal <= 26;
        const aValid = aTotal >= 21 && aTotal <= 26;

        let winner = null;
        if (uValid && aValid) {
            if (uTotal > aTotal) winner = 'USER';
            else if (aTotal > uTotal) winner = 'AI';
        } else if (uValid) {
            winner = 'USER';
        } else if (aValid) {
            winner = 'AI';
        }

        if (winner) {
            resolvedCount++;
            if (winner === 'USER') userWins++;
            else aiWins++;
        }
        return { uTotal, aTotal, winner };
    });

    return { resolvedCount, userWins, aiWins, isGameOver: resolvedCount === 3, trackResults };
};

// --- INITIAL STATE ---
const getInitialState = (mode = 'AI', opts = {}) => {
    const userDeck = createDeck('USER', opts.userKeys);
    const aiDeck = createDeck('AI', opts.aiKeys);
    return {
        phase: 'SETUP',
        mode,
        turn: 'USER',
        userDeck: userDeck.slice(5),
        aiDeck: aiDeck.slice(5),
        userHand: userDeck.slice(0, 5),
        aiHand: aiDeck.slice(0, 5),
        tracks: [ { user: [], ai: [] }, { user: [], ai: [] }, { user: [], ai: [] } ],
        selectedCard: null,
        message: mode === 'LOCAL' ? "Setup: Player 1, place a number card on an empty track." : "Setup Phase: Courier’s turn. Place a number card on an empty track.",
        winner: null
    };
};

// --- REDUCER ---
function gameReducer(state, action) {
    let newState = { ...state };
    const drawCards = (st, owner) => {
        const handKey = owner === 'USER' ? 'userHand' : 'aiHand';
        const deckKey = owner === 'USER' ? 'userDeck' : 'aiDeck';
        while (st[handKey].length < 5 && st[deckKey].length > 0) {
            st[handKey] = [...st[handKey], st[deckKey][0]];
            st[deckKey] = st[deckKey].slice(1);
        }
    };

    const nextTurn = (st) => {
        st.turn = st.turn === 'USER' ? 'AI' : 'USER';
        const local = st.mode === 'LOCAL';
        const base = local ? (st.turn === 'USER' ? "Player 1’s turn." : "Player 2’s turn.") : (st.turn === 'USER' ? "Your turn." : "Drifter is thinking...");
        if (st.phase === 'SETUP') {
            if (st.tracks.every(t => t.user.length > 0 && t.ai.length > 0)) { st.phase = 'PLAY'; st.message = "Game started! " + base; }
            else st.message = "Setup: " + base;
        } else st.message = base;

        const { isGameOver, userWins, aiWins } = checkTracksStatus(st.tracks);
        if (isGameOver) {
            st.phase = 'GAME_OVER';
            st.winner = userWins > aiWins ? 'USER' : 'AI';
            st.message = local ? (st.winner === 'USER' ? "Player 1 takes the pot." : "Player 2 takes the pot.")
                : (st.winner === 'USER' ? "You walked away with the caps." : "The Drifter cleaned you out.");
        }
    };

    switch (action.type) {
        case 'SELECT_CARD':
            if ((state.mode !== 'LOCAL' && state.turn !== 'USER') || state.phase === 'GAME_OVER') return state;
            return { ...state, selectedCard: action.card };

        case 'PLAY_NUMBER': {
            if (state.turn !== action.player || !action.card) return state;
            if (action.card.isFace) return state;

            const tIndex = action.trackIndex;
            const targetCaravan = state.tracks[tIndex][action.player.toLowerCase()];
            
            if (state.phase === 'SETUP') {
                if (targetCaravan.length > 0) {
                    if (action.player === 'USER' || state.mode === 'LOCAL') return { ...state, message: "Setup Phase: Must place on an empty track." };
                    return state;
                }
            } else if (!isValidNumberPlay(action.card, targetCaravan)) {
                if (action.player === 'USER' || state.mode === 'LOCAL') return { ...state, message: "Invalid play. Check direction and suit rules." };
                return state; 
            }

            const newTracks = [...state.tracks];
            newTracks[tIndex][action.player.toLowerCase()] = [...targetCaravan, { baseCard: action.card, modifiers: [] }];
            newState.tracks = newTracks;

            const handKey = action.player === 'USER' ? 'userHand' : 'aiHand';
            newState[handKey] = newState[handKey].filter(c => c.id !== action.card.id);
            
            newState.selectedCard = null;
            drawCards(newState, action.player);
            nextTurn(newState);
            return newState;
        }

        case 'PLAY_FACE': {
            if (state.turn !== action.player || state.phase === 'SETUP') return state;
            const tIndex = action.trackIndex;
            const tOwner = action.targetOwner.toLowerCase();
            const sIndex = action.stackIndex;
            
            let newTracks = [...state.tracks];
            let targetCaravan = [...newTracks[tIndex][tOwner]];
            
            if (action.card.value === 11) { // JACK
                targetCaravan.splice(sIndex, 1);
                newTracks[tIndex][tOwner] = targetCaravan;
            } else if (action.card.label === 'Jkr') { // JOKER
                const targetBaseValue = targetCaravan[sIndex].baseCard.value;
                const targetBaseSuit = targetCaravan[sIndex].baseCard.suit;
                
                for (let ti = 0; ti < 3; ti++) {
                    ['user', 'ai'].forEach(ownerKey => {
                        newTracks[ti][ownerKey] = newTracks[ti][ownerKey].filter((stack, stackIdx) => {
                            if (ti === tIndex && ownerKey === tOwner && stackIdx === sIndex) return true;
                            if (targetBaseValue === 1) return stack.baseCard.suit !== targetBaseSuit;
                            return stack.baseCard.value !== targetBaseValue;
                        });
                    });
                }
                
                const updatedTargetCaravan = newTracks[tIndex][tOwner];
                const updatedSIndex = updatedTargetCaravan.findIndex(s => s.baseCard.id === targetCaravan[sIndex].baseCard.id);
                if (updatedSIndex !== -1) {
                     let targetStack = { ...updatedTargetCaravan[updatedSIndex] };
                     targetStack.modifiers = [...targetStack.modifiers, action.card];
                     updatedTargetCaravan[updatedSIndex] = targetStack;
                }
            } else { // QUEEN/KING
                let targetStack = { ...targetCaravan[sIndex] };
                targetStack.modifiers = [...targetStack.modifiers, action.card];
                targetCaravan[sIndex] = targetStack;
                newTracks[tIndex][tOwner] = targetCaravan;
            }
            
            newState.tracks = newTracks;

            const handKey = action.player === 'USER' ? 'userHand' : 'aiHand';
            newState[handKey] = newState[handKey].filter(c => c.id !== action.card.id);
            
            newState.selectedCard = null;
            drawCards(newState, action.player);
            nextTurn(newState);
            return newState;
        }

        case 'DISCARD': {
            if (state.turn !== action.player || state.phase === 'SETUP') return state;
            const handKey = action.player === 'USER' ? 'userHand' : 'aiHand';
            newState[handKey] = newState[handKey].filter(c => c.id !== action.card.id);
            newState.selectedCard = null;
            drawCards(newState, action.player);
            nextTurn(newState);
            return newState;
        }

        case 'DISBAND': {
             if (state.turn !== action.player || state.phase === 'SETUP') return state;
             newState.tracks[action.trackIndex][action.player.toLowerCase()] = [];
             newState.message = `Disbanded caravan on route ${action.trackIndex + 1}.`;
             nextTurn(newState);
             return newState;
        }

        case 'PASS': {
            if (state.turn !== action.player) return state;
            newState.selectedCard = null;
            nextTurn(newState);
            return newState;
        }

        case 'RESET':
            return getInitialState(action.mode || state.mode, action.opts);

        default:
            return state;
    }
}

// --- COMPONENTS ---
const BackCtx = React.createContext('lucky38');
const BACKS = {
    lucky38: { name: 'Lucky 38', bg: '#3e1512', fg: '#b99a5e', mark: '38' },
    tops: { name: 'The Tops', bg: '#1a2638', fg: '#b59a55', mark: 'TOPS' },
    gomorrah: { name: 'Gomorrah', bg: '#34172f', fg: '#b05a76', mark: 'G' },
    ultra: { name: 'Ultra-Luxe', bg: '#16322a', fg: '#a89c66', mark: 'UL' },
};
const BackFace = ({ id, className = '' }) => {
    const b = BACKS[id] || BACKS.lucky38;
    return (
        <div className={`${className} rounded-[5px] border border-black/80 shadow-[0_1px_0_#7d7157,0_2px_0_#5f553f,0_5px_9px_rgba(0,0,0,0.75)] relative overflow-hidden shrink-0 worn`} style={{ background: '#b3a787', padding: 2.5 }}>
            <div className="w-full h-full rounded-[3px] relative overflow-hidden flex items-center justify-center" style={{ background: `repeating-linear-gradient(45deg, ${b.fg}33 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, ${b.fg}33 0 1px, transparent 1px 7px), radial-gradient(circle, ${b.bg}, #000 230%)` }}>
                <div className="absolute inset-[3px] rounded-[2px] border" style={{ borderColor: b.fg + '88' }} />
                <div className="rounded-full flex items-center justify-center font-serif font-black w-[58%] aspect-square border-2 text-[9px] sm:text-xs leading-none" style={{ borderColor: b.fg, color: b.fg, background: b.bg }}>{b.mark}</div>
            </div>
        </div>
    );
};
const PIPS = { 2: [0, 1, 0], 3: [0, 3, 0], 4: [2, 0, 2], 5: [2, 1, 2], 6: [3, 0, 3], 7: [3, 1, 3], 8: [3, 2, 3], 9: [4, 1, 4], 10: [4, 2, 4] };

// Draw animation: card travels from the deck to its slot; when `flip` it turns from face-down to face-up on the way.
const useDrawAnim = (id, flip, delay) => {
    const ref = React.useRef(null);
    React.useLayoutEffect(() => {
        const el = ref.current; if (!el || !el.animate) return;
        const d = [id, id + '-chip'].map(x => document.getElementById(x)).map(x => x && x.getBoundingClientRect()).find(r => r && r.width)
            || { left: window.innerWidth - 60, top: flip ? window.innerHeight + 40 : -100, width: 40, height: 60 };
        const a = el.getBoundingClientRect();
        const dx = d.left + d.width / 2 - (a.left + a.width / 2), dy = d.top + d.height / 2 - (a.top + a.height / 2);
        el.animate([
            { transform: `translate(${dx}px, ${dy}px) rotateY(${flip ? 180 : 0}deg) scale(.85)`, offset: 0 },
            { transform: `translate(${dx * 0.4}px, ${dy * 0.4 - 40}px) rotateY(${flip ? 100 : 0}deg) scale(1.05)`, offset: 0.55 },
            { transform: 'none', offset: 1 }], { duration: 700, delay, easing: 'cubic-bezier(.25,.7,.3,1)', fill: 'backwards' });
    }, []);
    return ref;
};
const DealWrap = ({ i, children }) => {

const SFX = (() => {

        const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f1, t);

    };
    const tone = (t, f1, f2, dur, vol, type = 'sine') => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);

        o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    };
    const sounds = {
        tick: t => noise(t, 0.025, 'bandpass', 1800, 1, 0.12),
        flick: t => { noise(t, 0.05, 'highpass', 3000, 0.7, 0.22); noise(t, 0.04, 'bandpass', 1800, 1, 0.12); },
        place: t => { tone(t, 150, 55, 0.12, 0.5); noise(t, 0.09, 'lowpass', 500, 0.7, 0.5); noise(t, 0.02, 'bandpass', 2500, 1, 0.3); },
        discard: t => { noise(t, 0.12, 'bandpass', 2500, 0.8, 0.22, 900); },
        swish: t => noise(t, 0.28, 'bandpass', 3200, 0.8, 0.3, 700),
        shuffle: t => { for (let k = 0; k < 20; k++) noise(t + k * 0.027, 0.035, 'bandpass', R(2200, 4000), 1, R(0.12, 0.22)); tone(t + 0.58, 120, 60, 0.1, 0.3); noise(t + 0.58, 0.06, 'lowpass', 600, 0.7, 0.3); },
        caps: (t, n = 3) => { for (let k = 0; k < n; k++) { const s = t + k * 0.065 + R(0, 0.03), p = R(2600, 5200); tone(s, p, p * 0.97, 0.07, 0.07, 'triangle'); tone(s, p * 2.76, p * 2.7, 0.04, 0.04, 'triangle'); noise(s, 0.025, 'highpass', 5500, 0.7, 0.14); } },
        pencil: t => {
            const dur = 0.42, s = ctx.createBufferSource(); s.buffer = buf;
            const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.5; f.frequency.setValueAtTime(1800, t); f.frequency.linearRampToValueAtTime(3400, t + dur);
            const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);

const legalActions = (st) => {
    const acts = [];
    st.aiHand.forEach(card => {
        for (let t = 0; t < 3; t++) {
            if (!card.isFace) {
                const c = st.tracks[t].ai;
                if (st.phase === 'SETUP' ? c.length === 0 : isValidNumberPlay(card, c))
                    acts.push({ type: 'PLAY_NUMBER', player: 'AI', card, trackIndex: t });
            } else if (st.phase === 'PLAY') {
                ['user', 'ai'].forEach(o => st.tracks[t][o].forEach((s, i, arr) => {
                    if (card.value === 12 && i !== arr.length - 1) return;
                    acts.push({ type: 'PLAY_FACE', player: 'AI', card, trackIndex: t, targetOwner: o.toUpperCase(), stackIndex: i });
                }));
            }
        }
        if (st.phase === 'PLAY') acts.push({ type: 'DISCARD', player: 'AI', card });
    });
    return acts;
};
const simulate = (st, act) => { const s = gameReducer(structuredClone(st), act); return s.turn !== st.turn ? s : null; };
const evalState = (s) => {
    let sc = 0;
    const f = x => x > 26 ? -15 : x >= 21 ? 60 + x : x * 2;
    s.tracks.forEach(t => {
        const a = getCaravanTotal(t.ai), u = getCaravanTotal(t.user);
        const av = a >= 21 && a <= 26, uv = u >= 21 && u <= 26;
        sc += f(a) - 0.9 * f(u);
        if (av && (!uv || a > u)) sc += 40;
        if (uv && (!av || u > a)) sc -= 40;
    });
    const r = checkTracksStatus(s.tracks);
    if (r.isGameOver) sc += r.aiWins > r.userWins ? 1000 : -1000;
    return sc;
};
const pickAI = (st, diff) => {
    const acts = legalActions(st);
    if (diff === 'HARD') {
        let best = null, bs = -Infinity;
        acts.forEach(a => {
            const s = simulate(st, a); if (!s) return;
            let sc = evalState(s) + Math.random() * 2;
            if (a.type === 'DISCARD') sc -= 4 + (a.card.isFace ? 10 : 0);
            if (sc > bs) { bs = sc; best = a; }
        });
        if (best) return best;
    }
    if (diff === 'EASY') {
        const nums = acts.filter(a => a.type === 'PLAY_NUMBER'), dis = acts.filter(a => a.type === 'DISCARD');
        const pool = (st.phase === 'PLAY' && Math.random() < 0.3 && dis.length) ? dis : (nums.length ? nums : dis);
        if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
    }
    const n = determineAIMove(st);
    if (n && simulate(st, n)) return n;
    return acts.find(a => simulate(st, a)) || { type: 'PASS', player: 'AI' };
};

        const inR = v => v >= 21 && v <= 26;
        let glass = false, pencil = false;
        Object.keys(cur).forEach(k => { if (cur[k] > 26 && prev.cur[k] <= 26) glass = true; else if (inR(cur[k]) && !inR(prev.cur[k])) pencil = true; });
        if (cnt < prev.cnt) SFX.play('swish');
        else if (cnt > prev.cnt || mods > prev.mods) { SFX.play('place'); setTimeout(() => SFX.play('flick'), 130); }
        else if (prev.turn !== turn) SFX.play('discard');
        if (glass) setTimeout(() => SFX.play('glass'), 200); else if (pencil) setTimeout(() => SFX.play('pencil'), 200);
    }, [tracks, turn]);
    const local = mode === 'LOCAL';
    const me = local ? turn : 'USER';
    const opp = me === 'USER' ? 'AI' : 'USER';
    const canAct = phase !== 'GAME_OVER' && screen === 'GAME' && (local ? !handover : turn === 'USER');
    const myHand = me === 'USER' ? userHand : aiHand;
    const oppHand = me === 'USER' ? aiHand : userHand;
    const myDeck = me === 'USER' ? state.userDeck : state.aiDeck;
    const oppDeck = me === 'USER' ? state.aiDeck : state.userDeck;
    const names = local ? { USER: 'PLAYER 1', AI: 'PLAYER 2' } : { USER: 'COURIER', AI: 'DRIFTER' };
    const faceSel = selectedCard && selectedCard.isFace ? selectedCard : null;
    const numSel = selectedCard && !selectedCard.isFace;

    useEffect(() => {
        if (mode !== 'AI' || turn !== 'AI' || phase === 'GAME_OVER') return;
        const t = setTimeout(() => dispatch(pickAI(state, settings.difficulty)), settings.difficulty === 'HARD' ? 1400 : 1800);
        return () => clearTimeout(t);
    }, [turn, phase, mode]);

    useEffect(() => {
        if (local && screen === 'GAME' && phase !== 'GAME_OVER' && prevTurn.current !== turn) setHandover(true);
        prevTurn.current = turn; setArmed(null); setDisbandMode(false);
    }, [turn]);

    useEffect(() => {
        if (phase !== 'GAME_OVER') { settled.current = false; return; }
        if (settled.current) return;
        settled.current = true;
        if (mode === 'AI') setWl(w => { const n = winner === 'USER' ? [w[0] + 1, w[1]] : [w[0], w[1] + 1]; ls.set('caravan_wl', n); return n; });
        if (mode === 'AI' && settings.bet > 0) {
            const d = winner === 'USER' ? Math.round(settings.bet * MULT[settings.difficulty]) : -settings.bet;
            setPayout(d); setTimeout(() => d > 0 ? SFX.play('caps', 8) : SFX.play('thud'), 600);
            setCaps(c => { const n = Math.max(0, c + d); saveCaps(n); return n; });
        } else setPayout(null);
    }, [phase]);

    const canStart = settings.mode === 'LOCAL' || settings.bet <= caps;
    const start = () => {
        if (!canStart) return;
        SFX.play('shuffle'); skip.current = true;
        const rk = [...ALL_KEYS].sort(() => Math.random() - 0.5).slice(0, 30 + Math.floor(Math.random() * 25));
        dispatch({ type: 'RESET', mode: settings.mode, opts: { userKeys: deckKeys, aiKeys: settings.mode === 'LOCAL' ? deckKeys : rk } });
        setPayout(null); setStarted(true); setScreen('GAME'); setHandover(settings.mode === 'LOCAL');
    };
    const scavenge = () => { SFX.play('caps', 5); const n = caps + 25; setCaps(n); saveCaps(n); setSettings(s => ({ ...s, bet: Math.min(s.bet, 10) })); };

    const onCard = (card) => { if (canAct) { SFX.play('flick'); dispatch({ type: 'SELECT_CARD', card }); } };
    const onDrop = (t) => { if (numSel && canAct) dispatch({ type: 'PLAY_NUMBER', player: me, card: selectedCard, trackIndex: t }); };
    const onStack = (t, owner, i) => {
        if (!faceSel || !canAct) return;
        if (faceSel.value === 12 && i !== tracks[t][owner.toLowerCase()].length - 1) return;
        dispatch({ type: 'PLAY_FACE', player: me, card: faceSel, trackIndex: t, targetOwner: owner, stackIndex: i });
    };
    const onDiscard = () => { if (selectedCard && phase === 'PLAY' && canAct) dispatch({ type: 'DISCARD', player: me, card: selectedCard }); };
    const onDisband = (t) => { dispatch({ type: 'DISBAND', trackIndex: t, player: me }); setDisbandMode(false); };
    const tc = (v) => v >= 21 && v <= 26 ? 'text-[#8fa56a]' : v > 26 ? 'text-[#b0463a]' : 'text-[#a8997c]';

    const cancelSel = () => { setDisbandMode(false); if (selectedCard) dispatch({ type: 'SELECT_CARD', card: null }); };
    const cycleCard = () => { if (!myHand.length) return; const i = myHand.findIndex(c => c.id === selectedCard?.id); onCard(myHand[(i + 1) % myHand.length]); };
    useEffect(() => {
        const h = (e) => { if (screen !== 'GAME' || !canAct || e.metaKey || e.ctrlKey) return; const k = e.key.toLowerCase();
            if (k === 'w') cycleCard(); else if (k === 'q') onDiscard(); else if (k === 'e' && phase === 'PLAY') setDisbandMode(m => !m); else if (k === 'r') cancelSel(); };
        window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
    });

    return (
        <BackCtx.Provider value={back}>
        <div className="relative min-h-[100dvh] flex flex-col p-2 sm:p-4 lg:p-6 text-[#f1e4c4] selection:bg-none overflow-hidden wood">
            <div className="absolute inset-0 shadow-[inset_0_0_100px_rgba(0,0,0,0.9)] pointer-events-none z-0"></div>
            <div className="absolute inset-0 pointer-events-none z-40 film"></div>

            {/* Header */}
            <div className="relative z-10 flex flex-wrap justify-between items-start mb-2 px-2 gap-2">
                <div className="flex flex-col">
                    <h1 className="title-font text-2xl sm:text-4xl text-[#c9a860] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] leading-none">CARAVAN</h1>
                </div>
                <div className="flex-1 min-w-[160px] text-center self-center lg:hidden">
                    <span className={`hud text-sm sm:text-base ${canAct ? '' : 'opacity-60'}`}>{message}</span>
                </div>
                <div className="hud text-sm sm:text-base lg:text-xl w-[190px] sm:w-[230px] lg:w-[320px] leading-snug">
                    {!local && <HudRow l="Ante Pot" v={settings.bet} />}
                    {!local && <HudRow l="Net Total" v={caps} />}
                    {!local && <HudRow l="Win/Loss" v={`${wl[0]}/${wl[1]}`} />}
                    {phase !== 'SETUP' && <HudRow l={local ? 'P1 / P2 routes' : 'Routes'} v={`${trackStatus.userWins}/${trackStatus.aiWins}`} />}
                    <div className="flex justify-end gap-4 mt-1 text-xs opacity-80">
                        <button className="hud-cmd" onClick={toggleMute}>Sound {muted ? 'off' : 'on'}</button>
                        <button className="hud-cmd" onClick={() => { SFX.play('tick'); setScreen('MENU'); }}>Menu</button>
                    </div>
                </div>
            </div>

            {/* Main */}
            <div className="relative z-10 flex-1 flex flex-col lg:grid lg:grid-cols-[1fr_minmax(340px,38%)] lg:grid-rows-[1fr_1fr_auto] gap-x-6 min-h-0">
                {/* Opponent hand + deck */}
                <div className="flex justify-center lg:justify-center items-start lg:items-center gap-8 mb-3 lg:mb-0 lg:col-start-2 lg:row-start-1">
                    <div className="flex items-start pt-1 h-12 lg:h-auto oppwrap">
                        {oppHand.map((oc, i) => (
                            <div key={oc.id} style={fan(i, oppHand.length, false, -1)}><OppCard i={i}><BackFace id={back} className="oppsz" /></OppCard></div>
                        ))}
                    </div>
                    <DeckPile id="deck-opp" n={oppDeck.length} small />
                </div>

                {/* Routes */}
                <div className="flex justify-around gap-2 sm:gap-4 flex-1 w-full max-w-5xl mx-auto lg:max-w-none lg:mx-0 lg:col-start-1 lg:row-start-1 lg:row-span-2 min-h-0">
                    {[0, 1, 2].map(tIndex => {
                        const info = trackStatus.trackResults[tIndex];
                        const tot = { USER: info.uTotal, AI: info.aTotal };
                        const oppC = tracks[tIndex][opp.toLowerCase()];
                        const myC = tracks[tIndex][me.toLowerCase()];
                        const showDrop = numSel && canAct && (phase !== 'SETUP' || myC.length === 0);
                        const canTarget = phase === 'PLAY' && canAct;
                        return (
                            <div key={tIndex} className="flex flex-col flex-1 max-w-[220px] lg:max-w-[340px] items-center p-1 sm:p-2 relative">
                                <Caravan anim="anim-top" caravan={oppC} tIndex={tIndex} owner={opp} onTarget={onStack} canTarget={canTarget} faceSel={faceSel} />

                                <div className={`stencil relative z-50 ${info.winner === 'USER' ? 'win-user' : info.winner === 'AI' ? 'win-ai' : ''}`}>
                                    <div className="flex items-baseline justify-center gap-2"><b key={tot[opp]} className={`hud anim-pop inline-block text-base sm:text-lg ${tc(tot[opp])}`}>{tot[opp]}</b><span className="carve text-xs sm:text-sm">{ROUTE_TOP[tIndex]}</span></div>
                                    <div className="flex items-baseline justify-center gap-2"><b key={tot[me]} className={`hud anim-pop inline-block text-base sm:text-lg ${tc(tot[me])}`}>{tot[me]}</b><span className="carve text-xs sm:text-sm">{ROUTE_BOT[tIndex]}</span></div>
                                </div>

                                <Caravan anim="anim-bot" caravan={myC} tIndex={tIndex} owner={me} onTarget={onStack} canTarget={canTarget} faceSel={faceSel}
                                    extra={showDrop && (
                                        <button onClick={() => onDrop(tIndex)} className="cardsz border-2 border-dashed border-[#e0a040]/50 rounded bg-black/20 hover:bg-black/30 flex items-center justify-center hud text-xs animate-pulse">[ PLACE ]</button>
                                    )} />

                                <div className="h-7 mt-1 flex items-center">
                                    {canAct && disbandMode && myC.length > 0 && <button onClick={() => onDisband(tIndex)} className="hud-cmd text-sm animate-pulse">▶ Discard this route</button>}
                                </div>
                            </div>
                        );
                    })}
                </div>

                {/* My hand, deck and commands */}
                <div className="mt-2 lg:mt-0 flex flex-col items-center lg:items-stretch lg:col-start-2 lg:row-start-2 lg:self-center gap-1 relative">
                    <div className="flex justify-center items-end gap-4 lg:gap-8">
                        <div className="flex justify-center items-end pt-10 pb-3 handwrap">
                            {myHand.map((card, ix) => { const sel = selectedCard?.id === card.id; return <div key={card.id} style={fan(ix, myHand.length, sel)}><CardView deal i={ix} card={card} isSelected={sel} onClick={() => onCard(card)} /></div>; })}
                        </div>
                        <div className="pb-4"><DeckPile id="deck-me" n={myDeck.length} /></div>
                    </div>
                </div>
                <div className="hidden lg:flex lg:col-start-1 lg:row-start-3 items-end pb-2 px-4"><span className="hud text-xl">{message}</span></div>
                <div className="hud text-base sm:text-lg lg:text-xl flex flex-row lg:flex-col flex-wrap justify-center lg:items-end gap-x-5 lg:gap-x-0 gap-y-0.5 lg:pr-2 lg:col-start-2 lg:row-start-3 mt-1">
                    <button className="hud-cmd" disabled={!canAct || myHand.length === 0} onClick={cycleCard}>Select Card W)</button>
                    <button className="hud-cmd" disabled={!canAct || phase !== 'PLAY' || !selectedCard} onClick={onDiscard}>Discard Card Q)</button>
                    <button className="hud-cmd" disabled={!canAct || phase !== 'PLAY'} onClick={() => setDisbandMode(m => !m)}>{disbandMode ? 'Pick a route…' : 'Discard Track E)'}</button>
                    <button className="hud-cmd" disabled={!canAct || (!selectedCard && !disbandMode)} onClick={cancelSel}>Cancel R)</button>
                    {phase === 'PLAY' && canAct && myHand.length === 0 && <button className="hud-cmd" onClick={() => dispatch({ type: 'PASS', player: me })}>Pass turn</button>}
                </div>
            </div>

            {/* Hot-seat handover */}
            {local && handover && screen === 'GAME' && phase !== 'GAME_OVER' && (
                <div className="absolute inset-0 z-[55] bg-black/95 flex items-center justify-center p-4">
                    <div className="text-center">
                        <p className="text-xs uppercase tracking-widest text-[#888] mb-2">Hands hidden</p>
                        <h2 className="title-font text-3xl text-[#c2a257] mb-6">{turn === 'USER' ? 'PLAYER 1' : 'PLAYER 2'}, YOUR TURN</h2>
                        <Btn onClick={() => setHandover(false)}>Show my hand</Btn>
                    </div>
                </div>
            )}

            {/* Menu */}
            {screen === 'MENU' && (
                <div className="absolute inset-0 z-[60] bg-black/85 flex p-4 overflow-y-auto backdrop-blur-sm">
                    <div className="m-auto wood-panel rounded-lg p-5 max-w-md w-full relative text-center">
                        <h2 className="title-font text-5xl text-[#c2a257] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">CARAVAN</h2>
                        <p className="text-[10px] text-[#c9b48a] uppercase tracking-[0.3em] mb-2">New Vegas Rules</p>
                        <Lbl>Mode</Lbl>
                        <div className="flex gap-2 justify-center">
                            <Opt on={settings.mode === 'AI'} onClick={() => setSettings(s => ({ ...s, mode: 'AI' }))}>vs Drifter</Opt>
                            <Opt on={settings.mode === 'LOCAL'} onClick={() => setSettings(s => ({ ...s, mode: 'LOCAL' }))}>Local 2P</Opt>
                        </div>
                        {settings.mode === 'AI' ? (<>
                            <Lbl>Difficulty</Lbl>
                            <div className="flex gap-2 justify-center">
                                {[['EASY', 'Rookie'], ['NORMAL', 'Gambler'], ['HARD', 'Cheat']].map(([d, l]) => (
                                    <Opt key={d} on={settings.difficulty === d} onClick={() => setSettings(s => ({ ...s, difficulty: d }))}>
                                        <span>{l}</span><span className="text-[10px] opacity-70 normal-case">win ×{MULT[d]}</span>
                                    </Opt>
                                ))}
                            </div>
                            <Lbl>Place your bet</Lbl>
                            <div className="flex gap-2 justify-center flex-wrap">
                                <Opt on={settings.bet === 0} onClick={() => setSettings(s => ({ ...s, bet: 0 }))}><span className="h-12 flex items-center text-[10px]">No stakes</span><span>Practice</span></Opt>
                                {[10, 25, 50, 100].map(b => (
                                    <Opt key={b} on={settings.bet === b} disabled={b > caps} onClick={() => { setSettings(s => ({ ...s, bet: b })); SFX.play('caps', Math.min(8, Math.ceil(b / 10))); }}><Money amount={b} /><span>{b}</span></Opt>
                                ))}
                            </div>
                            <div className="mt-3 flex items-center justify-center gap-3 text-[#c2a257] text-sm font-bold">
                                <Money amount={Math.min(caps, 200)} /> <span>Bankroll: {caps} caps</span>
                            </div>
                            {caps < 10 && <button onClick={scavenge} className="text-xs text-[#c2a257] underline mt-1">Out of caps? Scavenge +25</button>}
                        </>) : <p className="text-xs text-[#c9b48a] mt-3">Pass the device between turns. Hands stay hidden until the next player taps.</p>}
                        <Lbl>Card back</Lbl>
                        <div className="flex gap-2 justify-center">
                            {Object.entries(BACKS).map(([id, b]) => (
                                <button key={id} onClick={() => { setBack(id); ls.set('caravan_back', id); }} className={`flex flex-col items-center gap-1 transition-transform ${back === id ? '-translate-y-1' : 'opacity-70 hover:opacity-100'}`}>
                                    <BackFace id={id} className={`w-12 h-[4.5rem] ${back === id ? 'ring-2 ring-[#c2a257]' : ''}`} />
                                    <span className="text-[9px] text-[#c9b48a] uppercase">{b.name}</span>
                                </button>
                            ))}
                        </div>
                        <Lbl>Your deck</Lbl>
                        <div className="flex items-center justify-center gap-3">
                            <span className="text-xs text-[#c9b48a]">{deckKeys ? `Custom (${deckKeys.length} cards)` : 'Standard (54 cards)'}</span>
                            <Btn onClick={() => { setDraft(deckKeys || ALL_KEYS); setScreen('DECK'); }}>Build deck</Btn>
                        </div>
                        {settings.mode === 'AI' && <p className="text-[10px] text-[#a89878] mt-1">The Drifter plays a random deck.</p>}
                        <div className="flex gap-2 justify-center mt-5">
                            <Btn onClick={start} disabled={!canStart}>New Game</Btn>
                            {started && phase !== 'GAME_OVER' && <Btn onClick={() => setScreen('GAME')}>Resume</Btn>}
                        </div>
                    </div>
                </div>
            )}

            {/* Deck builder */}
            {screen === 'DECK' && draft && (
                <div className="absolute inset-0 z-[65] bg-black/90 flex p-3 overflow-y-auto">
                    <div className="m-auto wood-panel rounded-lg p-4 max-w-lg w-full text-center">
                        <h2 className="title-font text-3xl text-[#c2a257]">DECK BUILDER</h2>
                        <p className="text-xs text-[#c9b48a] mb-2">{draft.length} / 54 cards · minimum 30</p>
                        {SUITS.map(s => (
                            <div key={s} className="grid grid-cols-[repeat(13,minmax(0,1fr))] gap-0.5 mb-1">
                                {CARD_VALUES.map(c => { const k = s + c.label, on = draft.includes(k); return (
                                    <button key={k} onClick={() => toggleCard(k)} className={`aspect-[2/3] rounded-sm text-[9px] sm:text-xs font-black font-serif leading-tight ${on ? 'bg-[#f1e7d0] ' + SUIT_COLORS[s] : 'bg-black/40 text-[#6a5a48]'}`}>{c.label}<br />{s}</button>
                                ); })}
                            </div>
                        ))}
                        <div className="flex gap-1 justify-center mb-3">
                            {['Jkr1', 'Jkr2'].map(k => <button key={k} onClick={() => toggleCard(k)} className={`w-10 aspect-[2/3] rounded-sm text-xs font-black ${draft.includes(k) ? 'bg-[#f1e7d0] text-[#b8860b]' : 'bg-black/40 text-[#6a5a48]'}`}>★</button>)}
                        </div>
                        <div className="flex gap-2 justify-center flex-wrap mb-3">
                            <Btn onClick={() => setDraft(ALL_KEYS)}>All 54</Btn>
                            <Btn onClick={() => setDraft([...ALL_KEYS].sort(() => Math.random() - 0.5).slice(0, 30))}>Random 30</Btn>
                            <Btn onClick={() => setDraft([])}>Clear</Btn>
                        </div>
                        <div className="flex gap-2 justify-center">
                            <Btn disabled={draft.length < 30} onClick={() => { const v = draft.length === 54 ? null : draft; setDeckKeys(v); ls.set('caravan_deck', v); setScreen('MENU'); }}>Save deck</Btn>
                            <Btn onClick={() => setScreen('MENU')}>Cancel</Btn>
                        </div>
                    </div>
                </div>
            )}

            {/* Game over */}

            {phase === 'GAME_OVER' && screen === 'GAME' && (
                <div className="absolute inset-0 z-50 bg-black/90 flex items-center justify-center backdrop-blur-sm p-4">
                    <div className="wood-panel p-8 rounded text-center shadow-[0_0_50px_rgba(217,119,6,0.2)] max-w-md w-full relative overflow-hidden">
                        <div className="absolute inset-0 card-grime pointer-events-none opacity-20"></div>
                        <div className="relative z-10">
                            <h2 className="title-font text-4xl text-[#c2a257] mb-2">
                                {local ? (winner === 'USER' ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS') : (winner === 'USER' ? 'JACKPOT' : 'BUSTED')}
                            </h2>
                            <p className="text-sm text-[#aaa] mb-4 uppercase tracking-widest">{message}</p>
                            {payout !== null && <div className="mb-4 flex flex-col items-center gap-1"><Money amount={Math.abs(payout)} /><p className={`text-2xl font-black ${payout > 0 ? 'text-[#c9ab62]' : 'text-red-500'}`}>{payout > 0 ? '+' : '−'}{Math.abs(payout)} CAPS <span className="text-xs text-[#a89878] font-normal">({caps} total)</span></p></div>}
                            <div className="flex justify-center gap-8 mb-6 text-lg font-bold">
                                <div className="flex flex-col items-center"><span className="text-xs text-[#666] uppercase mb-1">{names.USER}</span><span className="text-[#b8964e] text-2xl">{trackStatus.userWins}</span></div>
                                <div className="w-px bg-[#333] h-12"></div>
                                <div className="flex flex-col items-center"><span className="text-xs text-[#666] uppercase mb-1">{names.AI}</span><span className="text-red-600 text-2xl">{trackStatus.aiWins}</span></div>
                            </div>
                            <div className="flex gap-2 justify-center">
                                <Btn onClick={canStart ? start : () => setScreen('MENU')}>Deal Again</Btn>
                                <Btn onClick={() => setScreen('MENU')}>Menu</Btn>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
        </BackCtx.Provider>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CaravanGame />);

</script></body></html>
